name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      
      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Node Dependencies
        run: |
          npm install
          npm run build

      - name: Zip project files
        run: |
          zip -r release.zip . -x "*.git*" -x "node_modules/*" -x "tests/*" -x ".env.example" -x "release.zip"

      - name: Upload release.zip to cPanel
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "
            set ssl:verify-certificate no;
            put release.zip;
            quit;
          "

      - name: Create standalone unzip script
        run: |
          cat << 'EOF' > unzip.php
          <?php
          $zipFile = '../release.zip';
          if (!file_exists($zipFile)) {
              die("release.zip not found!");
          }
          $zip = new ZipArchive;
          if ($zip->open($zipFile) === TRUE) {
              $zip->extractTo('../');
              $zip->close();
              unlink($zipFile);
              echo "Extraction successful.\n";
          } else {
              http_response_code(500);
              die("Extraction failed.");
          }
          EOF

      - name: Fix public permissions via FTP and upload unzip.php
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "
            set ssl:verify-certificate no;
            chmod 755 public || true;
            put unzip.php -o public/unzip.php;
            quit;
          "

      - name: Run Extraction
        run: |
          response=$(curl -s -w "\n%{http_code}" "https://admin.savioursfinance.com/unzip.php")
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" != "200" ]; then
            echo "Extraction failed HTTP $http_code"
            exit 1
          fi

      - name: Run Migrations and Optimize on Live Server
        run: |
          response=$(curl -s -w "\n%{http_code}" "https://admin.savioursfinance.com/system/deploy?token=${{ secrets.DEPLOY_TOKEN }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "Deploy endpoint returned HTTP $http_code"
            exit 1
          fi
